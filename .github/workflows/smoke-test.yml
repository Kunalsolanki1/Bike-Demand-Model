name: Model and app smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile app and test files
        run: python -m compileall -q app.py tests/smoke_test.py

      - name: Validate model and replay data
        run: python tests/smoke_test.py

      - name: Launch Streamlit and check health endpoint
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill $APP_PID
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          kill $APP_PID || true
          exit 1
